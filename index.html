<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#17221c;--mute:#6b7a71;--line:#e2e8e3;--pri:#0f7a55;--pri-d:#0b5e41;--pri2:#e2f3eb;--red:#c63f37;--red2:#fcebe9;--amb:#a8700f;--amb2:#fdf3df;--inc:#2563a8;--inc2:#e6eef8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,var(--pri),var(--pri-d));color:#fff;padding:14px 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.2px}
.sync{font-size:12px;opacity:.9;background:rgba(255,255,255,.15);padding:2px 10px;border-radius:20px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:10px auto 0;max-width:640px;background:rgba(255,255,255,.14);border-radius:12px;padding:3px}
.monthnav button{background:none;border:0;color:#fff;font-size:22px;width:44px;height:36px;border-radius:10px;cursor:pointer;line-height:1}
.monthnav button:active{background:rgba(255,255,255,.18)}
.monthnav .lbl{font-weight:700;font-size:16px;text-align:center}
.monthnav .lbl small{display:block;font-size:11px;font-weight:400;opacity:.85;cursor:pointer}
main{padding:14px 14px 110px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h2 .sub{font-size:12px;color:var(--mute);font-weight:400}
.hero{background:var(--card)}
.hero .big{font-size:30px;font-weight:800;margin:2px 0 8px}
.hero .lbl{color:var(--mute);font-size:13px}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{border-radius:12px;padding:8px 10px}
.pill b{display:block;font-size:16px}
.pill span{font-size:12px;color:var(--mute)}
.p-inc{background:var(--inc2)}.p-inc b{color:var(--inc)}
.p-exp{background:var(--red2)}.p-exp b{color:var(--red)}
.p-due{background:var(--amb2)}.p-due b{color:var(--amb)}
.p-ok{background:var(--pri2)}.p-ok b{color:var(--pri)}
.neg{color:var(--red)}.pos{color:var(--pri)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--mute)}
.row .amt{font-weight:700;white-space:nowrap}
.tap{cursor:pointer}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:16px;color:#fff}
.chk.on{background:var(--pri);border-color:var(--pri)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;font-weight:600}
.tag.red{background:var(--red2);color:var(--red)}.tag.amb{background:var(--amb2);color:var(--amb)}.tag.grn{background:var(--pri2);color:var(--pri)}.tag.gry{background:#eef1ef;color:var(--mute)}
.bar{height:8px;background:#edf1ee;border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:8px}
.catrow{padding:6px 0}
.catrow .h{display:flex;justify-content:space-between;font-size:14px}
.catrow .h span:last-child{font-weight:700}
.alert{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;margin-bottom:6px}
.alert.red{background:var(--red2)}.alert.gry{background:#f3f5f3}.alert.amb{background:var(--amb2)}
.alert .grow{flex:1;min-width:0}
.alert .t{font-weight:600;font-size:14px}
.alert .s{font-size:12px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:22px 10px}
.empty .ic{font-size:34px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.danger{background:var(--red2);color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.daygrp{font-size:12px;color:var(--mute);font-weight:700;margin:12px 4px 4px}
.instcard .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.instcard .nm{font-weight:700;font-size:16px}
.instcard .meta{font-size:12px;color:var(--mute)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.kv div{background:#f6f8f6;border-radius:10px;padding:6px 4px}
.kv b{display:block;font-size:14px}
.kv span{font-size:11px;color:var(--mute)}
.actions{display:flex;gap:8px;margin-top:10px}
.actions .btn{flex:1}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:7px 0 9px;font-size:11.5px;white-space:nowrap;letter-spacing:-.2px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.tabs button .i{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs button.on .i{filter:none;opacity:1}
.fab{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:18px;width:58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:30px;box-shadow:0 6px 18px rgba(15,122,85,.35);z-index:7;cursor:pointer;line-height:1}
.ov{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{background:#f0f2f0;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.f{margin-bottom:11px}
.f label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbfa;outline:none}
.f input:focus,.f select:focus{border-color:var(--pri);background:#fff}
.f .hint{font-size:12px;color:var(--mute);margin-top:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#f0f2f0;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--mute)}
.seg button.on.exp{background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.inc{background:#fff;color:var(--inc);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amtin{font-size:26px!important;font-weight:800;text-align:center}
.err{color:var(--red);font-size:13px;margin-bottom:8px;min-height:1px}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#1d2a23;color:#fff;padding:9px 18px;border-radius:24px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:#7fe0b0;font-weight:800;cursor:pointer;padding:0}
.lnk{float:left;color:var(--pri);font-weight:700;cursor:pointer;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:left;white-space:nowrap}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line)}
.up{color:var(--red);font-size:11px}.dn{color:var(--pri);font-size:11px}
.mgr{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.mgr input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafbfa;min-width:0}
.mgr input[readonly]{color:var(--mute);background:#f3f5f3}
.ib{border:0;background:#f0f2f0;width:34px;height:36px;border-radius:10px;cursor:pointer;flex-shrink:0}
.ib.del{background:var(--red2);color:var(--red)}
.ib:disabled{opacity:.35}
.mbar{display:flex;align-items:flex-end;gap:6px;height:90px;margin:8px 0 4px}
.mbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mute)}
.mbar i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:2px}
.mbar div.cur i{background:var(--amb)}
.dial{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,auto);gap:4px 2px;align-items:start;margin:4px 0 6px}
.slot{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.slot .ic{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .1s}
.slot:active .ic{transform:scale(.9)}
.slot .pc{font-size:13px;font-weight:800;line-height:1.1}
.slot .nm{font-size:10.5px;color:var(--mute);line-height:1.2;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcenter{grid-area:2/2/5/4;position:relative;align-self:center;cursor:pointer}
.dcenter svg{width:100%;display:block}
.dcenter .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22%}
.dcenter .ct .i{color:var(--inc);font-weight:800;font-size:15px;line-height:1.3}
.dcenter .ct .e{color:var(--red);font-weight:800;font-size:15px;line-height:1.3}
.dcenter .ct .l{font-size:10.5px;color:var(--mute)}
.balbar{display:block;width:100%;border:0;border-radius:14px;padding:11px;background:linear-gradient(160deg,var(--pri),var(--pri-d));color:#fff;font-weight:800;font-size:18px;cursor:pointer;margin-top:4px}
.balbar.neg{background:linear-gradient(160deg,#d65a52,#a8322b)}
.balbar small{font-weight:600;font-size:12px;opacity:.85;margin-inline-end:6px}
.bigbtns{display:flex;justify-content:space-around;margin:14px 0 4px}
.bigbtn{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font-weight:700;font-size:13px}
.bigbtn i{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:40px;font-weight:400;background:#fff;line-height:1}
.bigbtn.m i{border:5px solid #ef8a83;color:#e0584f}.bigbtn.m{color:#d0544b}
.bigbtn.p i{border:5px solid #6fd09c;color:#25a565}.bigbtn.p{color:#1f9a5c}
.bigbtn:active i{transform:scale(.94)}
.cic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.icgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.icgrid button{border:2px solid transparent;background:#f3f5f3;border-radius:12px;font-size:22px;height:44px;cursor:pointer}
.icgrid button.on{border-color:var(--pri);background:var(--pri2)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chkrow{display:flex;gap:10px;align-items:flex-start;background:#f3f8f5;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:11px;font-size:14px;cursor:pointer}
.chkrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri);flex-shrink:0}
.chkrow small{display:block;color:var(--mute);font-size:12px}
#gate{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#13895f,#0a5239);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#gate.hidden{display:none}
#gate h2{font-size:30px;margin:14px 0 4px;font-weight:800}
#gate p{opacity:.85;margin:0 0 26px;font-size:15px}
#gate .gbtn{display:flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:30px;padding:13px 24px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#gate .gmsg{margin-top:18px;font-size:13px;opacity:.9;min-height:20px}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="top"><h1 style="display:flex;align-items:center;gap:8px"><span style="display:flex;border-radius:9px;box-shadow:0 0 0 2px rgba(255,255,255,.25)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="30" height="30">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a374"/><stop offset="1" stop-color="#0a5239"/>
    </linearGradient>
    <linearGradient id="lgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#f0a52a"/>
    </linearGradient>
    <linearGradient id="lwal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f4ee"/>
    </linearGradient>
  <clipPath id="lr"><rect width="512" height="512" rx="116"/></clipPath></defs><g clip-path="url(#lr)">
  <rect width="512" height="512" rx="116" fill="url(#lbg)"/>
  <circle cx="420" cy="80" r="150" fill="#fff" opacity=".06"/>
  <!-- coins -->
  <circle cx="318" cy="150" r="62" fill="url(#lgold)"/>
  <circle cx="318" cy="150" r="44" fill="none" stroke="#c98314" stroke-width="7" opacity=".55"/>
  <circle cx="226" cy="168" r="50" fill="url(#lgold)" opacity=".95"/>
  <circle cx="226" cy="168" r="34" fill="none" stroke="#c98314" stroke-width="6" opacity=".55"/>
  <!-- wallet -->
  <rect x="96" y="196" width="320" height="226" rx="46" fill="url(#lwal)"/>
  <rect x="96" y="196" width="320" height="58" rx="29" fill="#cfe9dd"/>
  <rect x="96" y="226" width="320" height="28" fill="#cfe9dd"/>
  <!-- clasp -->
  <rect x="300" y="282" width="140" height="84" rx="30" fill="#0f7a55"/>
  <circle cx="344" cy="324" r="15" fill="url(#lgold)"/>
  <!-- check line -->

  <button class="gbtn" id="gbtn" style="display:none"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>ادخل بحساب جوجل</button>
  <div class="gmsg" id="gmsg">جارِ التحميل…</div>

<script>
/* ---------- النسخة المستقلة: تنزيل الملفات من غير Claude ---------- */
const DL={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:'saved'}}};
window.claude={use:async n=>n==='downloads'?DL:null};
/* ---------- ثوابت وأدوات ---------- */
const DEF_CATS=['أكل وشرب','عربية','إيجار','كهربا','مياه وغاز','نت وموبايل','بيت ومستلزمات','صحة وعلاج','تعليم','لبس','خروج وترفيه','مناسبات وهدايا','أقساط','أخرى'];
const DEF_INCATS=['مرتب','شغل إضافي','هدية','أخرى'];
const LOCKED=['أخرى','أقساط'];
const CATS_=()=>S.cats, INCATS_=()=>S.incats;
const ICONS={'أكل وشرب':'🍽️','عربية':'🚗','إيجار':'🏠','كهربا':'💡','مياه وغاز':'🔥','نت وموبايل':'📱','بيت ومستلزمات':'🛒','صحة وعلاج':'💊','تعليم':'📚','لبس':'👕','خروج وترفيه':'🎉','مناسبات وهدايا':'🎁','أقساط':'📆','جمعية':'🤝','سداد عجز':'💳','أخرى':'📦','مرتب':'💼','شغل إضافي':'💻','هدية':'🎁','مواصلات':'🚕','فواتير':'🧾','سكن وإيجار':'🏠'};
const DEF_COL={'أكل وشرب':'#e8739e','عربية':'#7b8aa3','إيجار':'#5aa9e6','كهربا':'#e0a21b','مياه وغاز':'#ef7d57','نت وموبايل':'#9b7fd4','بيت ومستلزمات':'#4db6ac','صحة وعلاج':'#e57373','تعليم':'#7986cb','لبس':'#ba68c8','خروج وترفيه':'#f0b429','مناسبات وهدايا':'#f06292','أقساط':'#8d6e63','جمعية':'#26a69a','سداد عجز':'#5c6bc0','أخرى':'#90a4ae','مرتب':'#2e9e6a','شغل إضافي':'#2563a8','هدية':'#f06292'};
const PALETTE=['#e8739e','#e0a21b','#5aa9e6','#7ccf9a','#9b7fd4','#ef7d57','#4db6ac','#c0ca33','#8d6e63','#f06292','#64b5f6','#ffb74d','#7986cb','#e57373','#7b8aa3','#26a69a'];
const ICON_CHOICES=['🍽️','🍔','☕','🛒','🥖','🚗','⛽','🚕','🚌','🔧','🏠','💡','🔥','💧','📱','🌐','📺','🧾','💊','🏥','🦷','📚','🎓','✏️','👕','👟','💇','🧴','🎉','🎬','⚽','✈️','🎁','💍','👶','🐱','🧹','🛠️','📆','💳','🏦','💰','💼','💻','📦','🏷️','❤️','🕌'];
function hashCol(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function meta(type,name){const m=(S.meta||{})[(type==='inc'?'inc':'exp')+':'+name]||{};return{i:m.i||ICONS[name]||'🏷️',c:m.c||DEF_COL[name]||hashCol(name)}}
const tint=c=>c+'26';
const catIc=(type,name,cls='cic')=>{const m=meta(type,name);return `<span class="${cls}" style="background:${tint(m.c)}">${m.i}</span>`};
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const N=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
const D=n=>Number(n).toLocaleString('ar-EG',{useGrouping:false});
const M=n=>N(n)+' ج.م';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curYM=()=>todayStr().slice(0,7);
const ymAdd=(ym,k)=>{let[y,m]=ym.split('-').map(Number);let t=y*12+(m-1)+k;return Math.floor(t/12)+'-'+pad(t%12+1)};
const ymDiff=(a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by-ay)*12+(bm-am)};
const dim=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const dueDate=(ym,day)=>ym+'-'+pad(Math.min(Math.max(1,day|0),dim(ym)));
const ymLabel=ym=>{const[y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+D(y)};
const ymShort=ym=>{const[y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+D(y%100).padStart(2,'٠')};
const dLabel=d=>{const[y,m,dd]=d.split('-').map(Number);return D(dd)+' '+MONTHS[m-1]};
const dayName=d=>{const[y,m,dd]=d.split('-').map(Number);return DAYS[new Date(y,m-1,dd).getDay()]};
const dDiff=(a,b)=>{const p=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{v=String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').trim();const n=parseFloat(v);return isFinite(n)?n:NaN};

/* ---------- الحالة والحفظ ---------- */
const LS='masrofati_v1';
const blank=()=>({v:1,updatedAt:0,tx:[],inst:[],bills:[],cats:[...DEF_CATS],incats:[...DEF_INCATS],carry:{},meta:{},gam:[],debts:[]});
function norm(o){const b=blank();if(!o||typeof o!=='object')return b;
  return{...b,...o,tx:Array.isArray(o.tx)?o.tx:[],
    inst:(Array.isArray(o.inst)?o.inst:[]).map(i=>({...i,paid:Array.isArray(i.paid)?i.paid:[]})),
    bills:(Array.isArray(o.bills)?o.bills:[]).map(b=>({...b,paid:Array.isArray(b.paid)?b.paid:[]})),
    gam:(Array.isArray(o.gam)?o.gam:[]).map(g=>({...g,paid:Array.isArray(g.paid)?g.paid:[]})),
    debts:Array.isArray(o.debts)?o.debts:[],
    cats:fixCats(o.cats,DEF_CATS,[...(o.tx||[]).filter(t=>t.type!=='inc').map(t=>t.cat),...(o.bills||[]).map(b=>b.cat)],LOCKED),
    incats:fixCats(o.incats,DEF_INCATS,(o.tx||[]).filter(t=>t.type==='inc').map(t=>t.cat),['أخرى']),
    meta:(o.meta&&typeof o.meta==='object'&&!Array.isArray(o.meta))?o.meta:{},
    carry:(o.carry&&typeof o.carry==='object'&&!Array.isArray(o.carry))?o.carry:{}}}
function fixCats(list,def,used,must){
  const out=[];const add=c=>{c=String(c||'').trim();if(c&&!out.includes(c))out.push(c)};
  (Array.isArray(list)&&list.length?list:def).forEach(add);used.forEach(add);
  must.forEach(c=>{if(!out.includes(c))out.push(c)});
  const o=out.indexOf('أخرى');if(o>=0&&o!==out.length-1){out.splice(o,1);out.push('أخرى')}
  return out;
}
function loadLocal(){try{return norm(JSON.parse(localStorage.getItem(LS)))}catch(e){return blank()}}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let S=loadLocal();
const UI={tab:'home',ym:curYM(),txFilter:'all'};

let ref=null,writing=false,dirty=false,wTimer=null,retries=0;
const SYNC={ok:'✓ محفوظ',saving:'جارِ الحفظ…',loading:'جارِ التحميل…',slow:'مش قادر أوصل للسيرفر',local:'محفوظ على الجهاز بس',offline:'من غير نت · هيتحفظ لما يرجع',err:'مشكلة في الحفظ'};
function setSync(k){if(k==='saving'&&!navigator.onLine)k='offline';document.getElementById('sync').textContent=SYNC[k]||''}
function save(){S.updatedAt=Date.now();persistLocal();render();if(ref){dirty=true;setSync('saving');clearTimeout(wTimer);wTimer=setTimeout(flush,500)}}
async function flush(){
  if(!ref||writing||!dirty)return;
  writing=true;dirty=false;
  const body=JSON.parse(JSON.stringify(S));
  try{await ref.set(body);console.info('[sync] saved');retries=0;if(!dirty)setSync('ok')}
  catch(e){console.error('[sync] save failed',e&&e.code,e&&e.message);
    if(e&&(e.code==='unavailable')&&retries<4){retries++;dirty=true;await new Promise(r=>setTimeout(r,1200+Math.random()*1500))}
    else if(e&&e.code==='quota_exceeded'){setSync('err');toast('مساحة الحفظ خلصت')}
    else setSync('err');
  }
  writing=false;if(dirty)flush();
}
async function initSync(){setSync('local')}
let unsubRemote=null;
function attachRemote(r){
  ref=null;setSync('loading');
  let served=false;
  const to=setTimeout(()=>{if(!served){setSync('slow');try{if(localStorage.getItem('masrofati_lp')!=='1'){localStorage.setItem('masrofati_lp','1');toast('بجرّب طريقة اتصال تانية…');setTimeout(()=>location.reload(),1500)}}catch(e){}}},12000);
  unsubRemote=r.onSnapshot(snap=>{
    console.info('[sync] snapshot',{exists:snap.exists,fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites});
    if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites){served=true;clearTimeout(to)}
    if(snap.metadata.hasPendingWrites){if(!snap.metadata.fromCache)setSync('saving');return}
    const remote=snap.exists?norm(snap.data()):null;
    if(remote&&remote.updatedAt>S.updatedAt){S=remote;persistLocal();if(ref&&!snap.metadata.fromCache&&repairExtras())save();else render()}
    if(!ref){ref=r;if(repairExtras()){save();return}
      if((!remote||S.updatedAt>remote.updatedAt)&&S.updatedAt>0){dirty=true;setSync('saving');flush();return}
    }
    if(!snap.metadata.fromCache){served=true;clearTimeout(to);if(!dirty&&!writing)setSync('ok')}
    else if(!navigator.onLine)setSync('offline');
  },err=>{clearTimeout(to);setSync('err');console.error('Firestore',err);toast('مشكلة في الاتصال: '+(err&&err.code||''))});
}
window.attachRemote=attachRemote;

/* ---------- حسابات ---------- */
const txIn=ym=>S.tx.filter(t=>t.date&&t.date.slice(0,7)===ym);
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const instActive=(i,ym)=>{const k=ymDiff(i.start,ym);return k>=0&&k<i.count};
const instEnd=i=>ymAdd(i.start,i.count-1);
const instPaidN=i=>i.paid.filter(p=>instActive(i,p)).length;
function instNext(i){for(let k=0;k<i.count;k++){const ym=ymAdd(i.start,k);if(!i.paid.includes(ym))return ym}return null}
const EXTRA_TYPES=['غرامة تأخير','رسوم دفع','فوايد','أخرى'];
const extrasOf=(it,ym)=>(it.extras&&Array.isArray(it.extras[ym]))?it.extras[ym]:[];
const extraSum=(it,ym)=>sum(extrasOf(it,ym),x=>x.amt);
const mlab=m=>mName(m)+(m.slice(0,4)!==curYM().slice(0,4)?' '+D(m.slice(0,4)):'');
const keyOf=(it,ym)=>it.nextMonth?ymAdd(ym,-1):ym;
const payMonth=(it,bm)=>it.nextMonth?ymAdd(bm,1):bm;
const dueOf=(it,bm)=>dueDate(payMonth(it,bm),it.day);
const payDate=()=>todayStr();
const belongTag=(it,bm)=>it.nextMonth?' · يخص '+mName(bm):'';
function shiftItem(it,k){it.start=ymAdd(it.start,k);it.paid=it.paid.map(p=>ymAdd(p,k));
  if(it.extras){const n={};Object.keys(it.extras).forEach(m=>n[ymAdd(m,k)]=it.extras[m]);it.extras=n}
  S.tx.forEach(t=>{if(t.link&&t.link.id===it.id&&!t.link.r&&!t.link.d)t.link.ym=ymAdd(t.link.ym,k)})}
const nextBox=(it,word)=>`<label class="chkrow"><input type="checkbox" id="fNext" ${it&&it.nextMonth?'checked':''}><span>${word} بيتدفع أول الشهر اللي بعده<small>مثلاً ${word} أكتوبر بيتدفع يوم ١ نوفمبر: هيتسمى ويتحسب استحقاقه على أكتوبر، والمصروف هيتحسب على الشهر اللي دفعته فيه.${it?'<br>لو غيّرت الاختيار ده، الدفعات اللي اتعلّمت هتتنقل للشهر اللي تخصه، والمصروفات هتفضل في مكانها.':''}</small></span></label>`;
function duesFor(ym){
  const out=[];
  S.bills.forEach(b=>{const bm=keyOf(b,ym);if(bm>=b.start)out.push({kind:'bill',id:b.id,name:b.name,sub:'التزام '+mlab(bm)+' · '+(b.cat||'أخرى'),amount:+b.amount+extraSum(b,bm),base:+b.amount,extra:extraSum(b,bm),date:dueOf(b,bm),paid:b.paid.includes(bm),ym:bm})});
  S.inst.forEach(i=>{const bm=keyOf(i,ym);if(instActive(i,bm))out.push({kind:'inst',id:i.id,name:i.name,sub:'قسط '+mlab(bm)+' (رقم '+D(ymDiff(i.start,bm)+1)+' من '+D(i.count)+')',amount:+i.monthly+extraSum(i,bm),base:+i.monthly,extra:extraSum(i,bm),date:dueOf(i,bm),paid:i.paid.includes(bm),ym:bm})});
  S.gam.forEach(g=>{const bm=keyOf(g,ym);if(instActive(g,bm))out.push({kind:'gam',id:g.id,name:g.name,sub:'جمعية · دفعة '+mlab(bm)+' (رقم '+D(ymDiff(g.start,bm)+1)+' من '+D(g.count)+')'+(g.turn===ym?' · شهر قبضك 🎉':''),amount:+g.monthly+extraSum(g,bm),base:+g.monthly,extra:extraSum(g,bm),date:dueOf(g,bm),paid:g.paid.includes(bm),ym:bm})});
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function alerts(){
  const t=todayStr(),cy=curYM(),out=[];
  for(let k=-6;k<=1;k++){
    const ym=ymAdd(cy,k);
    duesFor(ym).forEach(d=>{
      if(d.paid)return;
      if(d.kind==='bill'&&k<-1)return;
      const dd=dDiff(t,d.date);
      if(dd<=30)out.push({...d,dd});
    });
  }
  return out.sort((a,b)=>a.dd-b.dd);
}
function dueTag(dd){
  if(dd<0)return '<span class="tag red">متأخر '+D(-dd)+' يوم</span>';
  if(dd===0)return '<span class="tag red">النهارده</span>';
  if(dd===1)return '<span class="tag amb">بكرة</span>';
  if(dd<=7)return '<span class="tag amb">بعد '+D(dd)+' أيام</span>';
  return '<span class="tag gry">بعد '+D(dd)+' يوم</span>';
}

/* ---------- الترحيل ---------- */
const carryOf=ym=>{const c=S.carry[ym];return c?(+c.amt||0):0};
const decided=ym=>!!S.carry[ym];
function balOf(ym){const t=txIn(ym);return carryOf(ym)+sum(t.filter(x=>x.type==='inc'),x=>x.amount)-sum(t.filter(x=>x.type==='exp'),x=>x.amount)}
const hasActivity=ym=>txIn(ym).length>0||decided(ym);
const mName=ym=>MONTHS[+ym.slice(5)-1];
const sM=v=>(v>0?'+':v<0?'−':'')+M(Math.abs(v));
let cSign=1;
const debtPaid=(d,upto)=>sum(S.tx.filter(t=>t.link&&t.link.id===d.id&&t.link.d&&(!upto||t.date<=upto)),t=>t.amount);
const debtLeft=(d,upto)=>Math.max(0,Math.round((+d.amount-debtPaid(d,upto))*100)/100);
const debtsFor=ym=>S.debts.filter(d=>d.start<=ym&&(d.start===ym||debtLeft(d,ymAdd(ym,-1)+'-31')>0.009));
function debtCard(ym){
  const L=debtsFor(ym);if(!L.length)return'';
  return `<div class="card"><h2>💳 التزامات عليك تسددها<span class="sub">دوس عشان تسدّد</span></h2>`+L.map(d=>{
    const left=debtLeft(d,ym+'-31'),paid=+d.amount-left,pm=sum(S.tx.filter(t=>t.link&&t.link.id===d.id&&t.link.d&&t.date.slice(0,7)===ym),t=>t.amount);
    return `<div class="row tap" data-act="debtSheet" data-id="${d.id}">${catIc('exp','سداد عجز')}
      <div class="grow"><div class="t">${esc(d.name)}</div><div class="s">اتسدّد ${M(paid)} من ${M(d.amount)}${pm?' · الشهر ده '+M(pm):''} ${left<=0.009?'<span class="tag grn">خلص ✓</span>':''}</div>
      <div class="bar"><i style="width:${Math.min(100,paid/d.amount*100)}%;background:#5c6bc0"></i></div></div>
      <div class="amt" style="text-align:left">${left>0.009?`<span class="neg">${M(left)}</span><div style="font-size:11px;color:var(--pri);font-weight:700">سدّد ←</div>`:''}</div></div>`}).join('')+`</div>`;
}
function debtSheet(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;
  const left=debtLeft(d),paid=+d.amount-left,pays=S.tx.filter(t=>t.link&&t.link.id===d.id&&t.link.d).sort((a,b)=>a.date<b.date?1:-1);
  openSheet(head(esc(d.name))+`
    <div class="trio" style="margin-bottom:12px"><div class="pill p-exp"><span>الباقي عليك</span><b>${M(left)}</b></div><div class="pill p-ok"><span>اتسدّد</span><b>${M(paid)} من ${M(d.amount)}</b></div></div>
    ${left>0.009?`<div class="f2"><div class="f"><label>هتسدّد كام</label><input id="dAmt" inputmode="decimal" placeholder="المبلغ" autofocus></div>
      <div class="f"><label>التاريخ</label><input id="dDate" type="date" value="${UI.ym===curYM()?todayStr():UI.ym+'-01'}"></div></div>
      <div class="err" id="fErr"></div>

function donut(segs,total){

  else o=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="#e6ece8" stroke-width="30"/>`;
  return `<svg viewBox="0 0 200 200">${o}<circle cx="100" cy="100" r="61" fill="#f7faf8"/></svg>`;
}

function payList(ym){

function repRange(){
  const ym=UI.ym,p=UI.rp||'m';
  if(p==='3m')return[ymAdd(ym,-2),ym];
  if(p==='6m')return[ymAdd(ym,-5),ym];
  if(p==='y')return[ym.slice(0,4)+'-01',ym.slice(0,4)+'-12'];
  if(p==='c'){let a=UI.rFrom||ym,b=UI.rTo||ym;if(a>b)[a,b]=[b,a];return[a,b]}
  return[ym,ym];
}
const rangeLabel=(a,b)=>a===b?ymLabel(a):ymLabel(a)+' ← '+ymLabel(b);
const txRange=(a,b)=>S.tx.filter(t=>t.date&&t.date.slice(0,7)>=a&&t.date.slice(0,7)<=b);
function byCat(list){const m={};list.forEach(t=>{const c=t.cat||'أخرى';(m[c]=m[c]||{v:0,n:0});m[c].v+=+t.amount||0;m[c].n++});return m}
function repData(){
  const[a,b]=repRange(),n=ymDiff(a,b)+1;
  const tx=txRange(a,b),ex=tx.filter(t=>t.type==='exp'),inc=tx.filter(t=>t.type==='inc');
  const pa=ymAdd(a,-n),pb=ymAdd(a,-1),pex=txRange(pa,pb).filter(t=>t.type==='exp');
  const cur=byCat(ex),prev=byCat(pex);
  const order=[...S.cats,...Object.keys(cur).filter(c=>!S.cats.includes(c))];
  const rows=order.filter(c=>cur[c]).map(c=>({c,v:cur[c].v,n:cur[c].n,pv:prev[c]?prev[c].v:0})).sort((x,y)=>y.v-x.v);
  const months=[];for(let k=0;k<n;k++){const m=ymAdd(a,k),t=txIn(m);months.push({m,inc:sum(t.filter(x=>x.type==='inc'),x=>x.amount),exp:sum(t.filter(x=>x.type==='exp'),x=>x.amount)})}
  return{a,b,n,tot:sum(ex,t=>t.amount),inc:sum(inc,t=>t.amount),ptot:sum(pex,t=>t.amount),rows,incRows:Object.entries(byCat(inc)).sort((x,y)=>y[1].v-x[1].v),months,unused:S.cats.filter(c=>!cur[c])};
}

function repairExtras(){

const normName=n=>String(n||'').replace(/\s+/g,'').replace(/^ال/,'').replace(/[ىي]/g,'ي').replace(/[أإآا]/g,'ا').replace(/ة/g,'ه');

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,onSnapshot,getDocFromServer} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyAiM2pCxSvcsnVLaYnkM1LozlLl37JZjTY",
  authDomain:"masrofaty-d2f3a.firebaseapp.com",
  projectId:"masrofaty-d2f3a",
  storageBucket:"masrofaty-d2f3a.firebasestorage.app",
  messagingSenderId:"87240859583",
  appId:"1:87240859583:web:574c9687dfb1275bab8b0a"
});
const auth=getAuth(app);
const LP=(()=>{try{return localStorage.getItem('masrofati_lp')==='1'}catch(e){return false}})();
const fsOpts=LP?{experimentalForceLongPolling:true}:{experimentalAutoDetectLongPolling:true};
let db;try{db=initializeFirestore(app,{...fsOpts,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=initializeFirestore(app,fsOpts)}
window.fbReady=true;
getRedirectResult(auth).catch(e=>window.authError&&window.authError(e));
window.fbSignIn=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))await signInWithRedirect(auth,p);else throw e}};
window.fbSignOut=()=>signOut(auth);
let unsub=null;
onAuthStateChanged(auth,u=>{
  if(unsub){try{unsub()}catch(e){}unsub=null}
  window.onUser(u?{uid:u.uid,email:u.email,name:u.displayName}:null);
  if(!u)return;
  const d=doc(db,'users',u.uid);
  const wrap=(s,meta)=>{let data=null;if(s.exists()){try{data=JSON.parse(s.data().json)}catch(e){}}return{exists:!!data,data:()=>data,metadata:meta||s.metadata}};
  let CB=null;
  const pull=()=>getDocFromServer(d).then(s=>{if(CB)CB(wrap(s,{fromCache:false,hasPendingWrites:false}))}).catch(e=>console.warn('[sync] pull failed',e.code));
  const r={
    set:b=>setDoc(d,{json:JSON.stringify(b),updatedAt:b.updatedAt||0}),
    onSnapshot:(cb,eb)=>{CB=cb;const u1=onSnapshot(d,s=>cb(wrap(s)),eb);
      pull();const iv=setInterval(pull,60000);
      const vis=()=>{if(document.visibilityState==='visible')pull()};document.addEventListener('visibilitychange',vis);
      unsub=()=>{u1();clearInterval(iv);document.removeEventListener('visibilitychange',vis);CB=null};return unsub}
  };
  window.attachRemote(r);
  console.info('[sync] user',u.uid,'project',app.options.projectId,'longPolling',LP);
});
</script>
